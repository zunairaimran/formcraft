<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — FormCraft</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="form-page themed theme-lavender" id="page">
    <div class="form-box">
      <div class="form-accent"></div>
      <div class="form-body form-done">
        <h1>Page not found</h1>
        <p class="form-desc">The address may be mistyped, or the page was removed.</p>
        <a class="btn btn-primary" href="/">Go to the home page</a>
      </div>
    </div>
  </div>
  <script src="/js/visuals.js"></script>
  <script>Visuals.mount(document.getElementById('page'), 'stars', 'fixed');</script>
</body>
</html>
